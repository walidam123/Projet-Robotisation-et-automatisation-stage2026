version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: scraper_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraper_backend
    ports:
      - "8080:8080"
    environment:
      # On surcharge l'URL MongoDB pour utiliser le conteneur "mongodb" au lieu de localhost
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/marches_publics_db
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scraper_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
